<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faheem Mobile and Solar Electronics</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Poppins:wght@300;400;600;700&display=swap');
        body {
            font-family: 'Poppins', 'Noto Nastaliq Urdu', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Header / Navbar -->
    <header class="bg-blue-900 text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-bold tracking-wide">
                <i class="fa-solid fa-solar-panel text-yellow-400 mr-2"></i>
                Faheem Mobile & Solar
            </h1>
            <div class="flex items-center space-x-4 space-x-reverse">
                <button onclick="toggleCart()" class="relative bg-yellow-500 hover:bg-yellow-600 text-blue-900 font-bold px-4 py-2 rounded-lg transition duration-200 flex items-center">
                    <i class="fa-solid fa-cart-shopping ml-2"></i>
                    کارٹ (Cart)
                    <span id="cart-count" class="bg-red-600 text-white text-xs px-2 py-1 rounded-full absolute -top-2 -right-2">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Banner Section -->
    <section class="bg-gradient-to-r from-blue-800 to-indigo-900 text-white py-12 px-4 text-center">
        <h2 class="text-3xl md:text-4xl font-extrabold mb-3">فہیم موبائل اینڈ سولر الیکٹرانکس</h2>
        <p class="text-lg opacity-90 max-w-2xl mx-auto">بہترین معیار کے سولر پینلز، انورٹرز، بیٹریز اور موبائل ایکسیسریز کا قابلِ اعتماد مرکز۔</p>
    </section>

    <!-- Products Grid -->
    <main class="container mx-auto px-4 py-8">
        <h3 class="text-2xl font-bold mb-6 text-gray-800 border-b-2 border-yellow-500 pb-2 inline-block">ہماری پروڈکٹس (Featured Products)</h3>
        
        <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Dynamic Products will be loaded here -->
        </div>
    </main>

    <!-- Slide-over Shopping Cart -->
    <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex justify-end">
        <div class="bg-white w-full max-w-md h-full shadow-xl flex flex-col p-6">
            <div class="flex justify-between items-center border-b pb-4">
                <h3 class="text-xl font-bold"><i class="fa-solid fa-cart-shopping text-blue-900 ml-2"></i>آپ کا کارٹ</h3>
                <button onclick="toggleCart()" class="text-gray-500 hover:text-red-500 text-2xl font-bold">&times;</button>
            </div>

            <div id="cart-items" class="flex-grow overflow-y-auto py-4 space-y-4">
                <!-- Cart items list -->
            </div>

            <div class="border-t pt-4">
                <div class="flex justify-between font-bold text-lg mb-4">
                    <span>کل رقم (Total):</span>
                    <span>Rs. <span id="cart-total">0</span></span>
                </div>
                <button onclick="sendWhatsAppOrder()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg flex items-center justify-center text-lg transition duration-200">
                    <i class="fa-brands fa-whatsapp text-2xl ml-2"></i>
                    واٹس ایپ پر آرڈر بھیجیں
                </button>
            </div>
        </div>
    </div>

    <!-- Script Configuration -->
    <script>
        // 1. Supabase Initialization
        const SUPABASE_URL = 'https://ugebsmbdkcwwodlgacsj.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_tP00lKIUchNQ0Ye7WeSBvg_s4PlvJhm';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 2. WhatsApp Number Setup
        const WHATSAPP_NUMBER = '923149901845';

        // 3. Static Products Data
        const products = [
            { id: 1, name: 'Longi 550W Solar Panel Mono PERC', price: 24999, category: 'Solar' },
            { id: 2, name: 'Inverex Nitrox 6KW Hybrid Solar Inverter', price: 165000, category: 'Solar' },
            { id: 3, name: 'Osaka 200Ah Solar Battery Tall Tubular', price: 45000, category: 'Battery' },
            { id: 4, name: 'Solar DC Cable 6mm (Per Meter)', price: 180, category: 'Accessories' },
            { id: 5, name: 'LED Bulb 20W Energy Saver', price: 350, category: 'Electronics' }
        ];

        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        // Render Products
        function renderProducts() {
            const container = document.getElementById('product-list');
            container.innerHTML = products.map(product => `
                <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition duration-200 p-4 border border-gray-100 flex flex-col justify-between">
                    <div>
                        <div class="w-full h-40 bg-gray-100 rounded-lg flex items-center justify-center mb-4 text-blue-900">
                            <i class="fa-solid ${product.category === 'Solar' ? 'fa-solar-panel' : product.category === 'Battery' ? 'fa-car-battery' : 'fa-plug'} text-5xl"></i>
                        </div>
                        <h4 class="font-bold text-lg mb-2 text-gray-800">${product.name}</h4>
                        <p class="text-green-600 font-extrabold text-xl mb-4">Rs. ${product.price.toLocaleString()}</p>
                    </div>
                    <button onclick="addToCart(${product.id})" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-2 rounded-lg transition duration-200 flex items-center justify-center">
                        <i class="fa-solid fa-plus ml-2"></i> کارٹ میں شامل کریں
                    </button>
                </div>
            `).join('');
        }

        // Add to Cart
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            updateCart();
        }

        // Update Cart
        function updateCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
            document.getElementById('cart-count').innerText = cart.reduce((total, item) => total + item.quantity, 0);

            const cartContainer = document.getElementById('cart-items');
            if (cart.length === 0) {
                cartContainer.innerHTML = `<p class="text-gray-500 text-center py-8">آپ کا کارٹ خالی ہے۔</p>`;
            } else {
                cartContainer.innerHTML = cart.map(item => `
                    <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg border">
                        <div>
                            <h5 class="font-bold text-sm">${item.name}</h5>
                            <p class="text-xs text-gray-600">Rs. ${item.price} x ${item.quantity}</p>
                        </div>
                        <div class="flex items-center space-x-2 space-x-reverse">
                            <button onclick="changeQuantity(${item.id}, -1)" class="bg-gray-200 px-2 rounded text-lg font-bold">-</button>
                            <span class="font-bold">${item.quantity}</span>
                            <button onclick="changeQuantity(${item.id}, 1)" class="bg-gray-200 px-2 rounded text-lg font-bold">+</button>
                        </div>
                    </div>
                `).join('');
            }

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById('cart-total').innerText = total.toLocaleString();
        }

        function changeQuantity(productId, delta) {
            const item = cart.find(i => i.id === productId);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== productId);
                }
            }
            updateCart();
        }

        function toggleCart() {
            document.getElementById('cart-modal').classList.toggle('hidden');
        }

        // Send Order to WhatsApp
        function sendWhatsAppOrder() {
            if (cart.length === 0) {
                alert('آپ کا کارٹ خالی ہے!');
                return;
            }

            let message = `السلام علیکم! میں Faheem Mobile & Solar Electronics سے مندرجہ ذیل اشیاء کا آرڈر دینا چاہتا ہوں:\n\n`;
            let total = 0;

            cart.forEach((item, index) => {
                const subtotal = item.price * item.quantity;
                total += subtotal;
                message += `${index + 1}. ${item.name}\n   مقدار: ${item.quantity}\n   قیمت: Rs. ${subtotal.toLocaleString()}\n\n`;
            });

            message += `--------------------------\n`;
            message += `کل رقم: Rs. ${total.toLocaleString()}\n\nبراہِ کرم آرڈر کی تصدیق کریں۔`;

            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMessage}`;

            window.open(whatsappUrl, '_blank');
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            renderProducts();
            updateCart();
        });
    </script>
</body>
</html>
